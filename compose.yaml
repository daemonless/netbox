name: netbox

x-daemonless:
  title: "NetBox"
  category: "Utilities"
  icon: ":material-apps:"  # https://pictogrammers.com/library/mdi/ (material-) or https://simpleicons.org/ (simple-)
  description: "Network source of truth (IPAM/DCIM), built from the upstream NetBox release."
  upstream_url: "https://github.com/netbox-community/netbox"
  web_url: "https://netboxlabs.com/oss/netbox/"
  user: "bsd"
  upstream_binary: true
  notes: "Needs PostgreSQL 15+ and Redis. Migrations run automatically at start."

  networking:
    netbox: default
    "*": private
  hostnames:
    postgres: DB_HOST
    redis: REDIS_HOST

  appjail:
    director:
      options:
        - alias:
        - ip4_inherit:
    depends_on:
      - name: postgres
        image: ghcr.io/daemonless/postgres:18
        template: postgres-template.conf
        env:
          POSTGRES_DB: "!ENV '${DB_NAME}'"
          POSTGRES_USER: "!ENV '${DB_USER}'"
          POSTGRES_PASSWORD: "!ENV '${DB_PASSWORD}'"
        volumes:
          db_data: /var/lib/postgresql/data
      - name: redis
        image: ghcr.io/daemonless/redis:latest
  docs:
    env:
      ALLOWED_HOSTS: "Space-separated hostnames (default *)"
      CSRF_TRUSTED_ORIGINS: "Space-separated origins, e.g. https://netbox.example.com"
      NETBOX_CONFIG_PATH: "Path to store NetBox secrets, media and scripts"
      DB_DATA_LOCATION: "Path to store PostgreSQL data files"
      DB_HOST:
        desc: "Where NetBox finds PostgreSQL (set automatically for the built-in database; 127.0.0.1 on host networking)"
        level: advanced
        optional: true
      DB_NAME:
        desc: "PostgreSQL database name"
        level: advanced
        optional: true
      DB_USER:
        desc: "PostgreSQL user"
        level: advanced
        optional: true
      DB_PASSWORD: "Database password (or DB_PASSWORD_FILE)"
      REDIS_HOST:
        desc: "Where NetBox finds Redis (set automatically for the built-in Redis; 127.0.0.1 on host networking)"
        level: advanced
        optional: true
      NETBOX_SECRET_KEY: "Optional; auto-generated into /config/secret_key"
      NETBOX_API_TOKEN_PEPPER: "Optional; auto-generated into /config/api_token_pepper"
      SUPERUSER_NAME: "Optional first-run admin user"
      SUPERUSER_PASSWORD: "Optional first-run admin password"
      GRANIAN_WORKERS: "Granian worker processes (default 2)"
      GRANIAN_*: "Any Granian option via its env var, e.g. GRANIAN_WORKERS_LIFETIME"
    volumes:
      /config: "Secrets, media, scripts, configuration_extra.py"
    ports:
      8080: "Web UI"

services:
  netbox:
    image: ghcr.io/daemonless/netbox:latest
    container_name: netbox
    network_mode: host
    depends_on: [postgres, redis]
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_NAME=${DB_NAME:-netbox}
      - DB_USER=${DB_USER:-netbox}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - SUPERUSER_NAME=${SUPERUSER_NAME:-admin}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - GRANIAN_WORKERS=${GRANIAN_WORKERS:-4}
      # - GRANIAN_WORKERS_LIFETIME=12h
    volumes:
      - ${NETBOX_CONFIG_PATH}:/config
    ports:
      - 8080:8080

  postgres:
    image: ghcr.io/daemonless/postgres:18
    container_name: netbox-postgres
    network_mode: host
    restart: unless-stopped
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      - POSTGRES_DB=${DB_NAME:-netbox}
      - POSTGRES_USER=${DB_USER:-netbox}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data

  redis:
    image: ghcr.io/daemonless/redis:latest
    container_name: netbox-redis
    network_mode: host
    restart: unless-stopped
