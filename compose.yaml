name: netbox

x-daemonless:
  title: "NetBox"
  category: "Utilities"
  icon: ":material-apps:"  # https://pictogrammers.com/library/mdi/ (material-) or https://simpleicons.org/ (simple-)
  description: "Network source of truth (IPAM/DCIM), built from the upstream NetBox release."
  upstream_url: "https://github.com/netbox-community/netbox"
  web_url: "https://netboxlabs.com/oss/netbox/"
  user: "bsd"
  upstream_binary: true
  notes: "Needs PostgreSQL 15+ and Redis. Migrations run automatically at start."
  docs:
    env:
      ALLOWED_HOSTS: "Space-separated hostnames (default *)"
      CSRF_TRUSTED_ORIGINS: "Space-separated origins, e.g. https://netbox.example.com"
      DB_HOST: "PostgreSQL host"
      DB_NAME: "Database name"
      DB_USER: "Database user"
      DB_PASSWORD: "Database password (or DB_PASSWORD_FILE)"
      REDIS_HOST: "Redis host"
      NETBOX_SECRET_KEY: "Optional; auto-generated into /config/secret_key"
      NETBOX_API_TOKEN_PEPPER: "Optional; auto-generated into /config/api_token_pepper"
      SUPERUSER_NAME: "Optional first-run admin user"
      SUPERUSER_PASSWORD: "Optional first-run admin password"
      GRANIAN_WORKERS: "Granian worker processes (default 2)"
      GRANIAN_*: "Any Granian option via its env var, e.g. GRANIAN_WORKERS_LIFETIME"
    volumes:
      /config: "Secrets, media, scripts, configuration_extra.py"
    ports:
      8080: "Web UI"

services:
  netbox:
    image: ghcr.io/daemonless/netbox:latest
    container_name: netbox
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - DB_HOST=postgres
      - DB_PASSWORD=changeme
      - REDIS_HOST=redis
      - SUPERUSER_NAME=admin
      - SUPERUSER_PASSWORD=changeme
      - GRANIAN_WORKERS=4
      # - GRANIAN_WORKERS_LIFETIME=12h
    volumes:
      - /containers/netbox:/config
    ports:
      - 8080:8080
    depends_on: [postgres, redis]
    restart: always

  postgres:                        # placeholder: any PostgreSQL 15+ FreeBSD image
    image: ghcr.io/daemonless/postgres:18
    environment:
      - POSTGRES_DB=netbox
      - POSTGRES_USER=netbox
      - POSTGRES_PASSWORD=changeme
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    volumes:
      - /containers/netbox/postgres:/var/lib/postgresql/data
    restart: always

  redis:                           # placeholder: any Redis/Valkey FreeBSD image
    image: ghcr.io/daemonless/redis:latest
    restart: always
